name: test

on:
  push:
    branches: [main, foundation-v0.2, wealth-system-v0.1]
  pull_request:
    branches: [main, foundation-v0.2, wealth-system-v0.1]
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run health
